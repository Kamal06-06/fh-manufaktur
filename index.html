<style>
/* FH Manufaktur – gleiches Layout wie die Showroom-App */
:root{
  --bg:#f5f2eb; --surface:#ffffff; --ink:#1a1714; --muted:#6b645a; --line:#dcd5c8;
  --accent:#1a1714; --accent-ink:#f2dfa8; --gold:#b8912f; --gold-soft:#f3e9cf; --soft:#f1ebdc;
  --hz:#c8102e; --ok:#1d6b3a; --ok-soft:#e3f1e7; --warn:#a4560a; --warn-soft:#fbf0d4; --bad:#a12c2c; --bad-soft:#fbe4e1;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f;
  --sans:"IBM Plex Sans","Segoe UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --brand:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e0c; --surface:#1a1816; --ink:#ece6d8; --muted:#a39b8c; --line:#2f2b25;
  --accent:#c9a24a; --accent-ink:#161310; --gold:#d4ad55; --gold-soft:#2b2518; --soft:#262219;
  --hz:#ff6b7d; --ok:#63c487; --ok-soft:#17291d; --warn:#e2a04e; --warn-soft:#33270f; --bad:#ee8a8a; --bad-soft:#3a1b19;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e0c; --surface:#1a1816; --ink:#ece6d8; --muted:#a39b8c; --line:#2f2b25;
  --accent:#c9a24a; --accent-ink:#161310; --gold:#d4ad55; --gold-soft:#2b2518; --soft:#262219;
  --hz:#ff6b7d; --ok:#63c487; --ok-soft:#17291d; --warn:#e2a04e; --warn-soft:#33270f; --bad:#ee8a8a; --bad-soft:#3a1b19;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--gold)}
h1{margin:0;display:flex;flex-direction:column;line-height:1.25}
.bn{font-family:var(--brand);font-size:24px;font-weight:700;letter-spacing:.18em;color:var(--gold);direction:ltr;text-align:start;line-height:1.1}
.bn small{display:block;font-size:11px;letter-spacing:.42em;font-weight:600}
.bs{font-size:13px;font-weight:500;color:var(--muted)}
.shh{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.shh b{flex:1;min-width:0;text-align:center;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.hm{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
#view{display:flex;flex-direction:column;gap:12px;min-width:0}#delZone{align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:10px;text-align:start;padding:12px;min-height:64px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;width:100%}
.tile .ic{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.tile .ic svg{width:19px;height:19px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.tile b{font-size:15.5px}.tile span{font-size:12.5px;color:var(--muted)}
.tile.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.tile.primary span{color:var(--accent-ink);opacity:.8}
.tile.primary .ic{background:rgba(242,223,168,.14)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi small{display:block;font-size:12px;color:var(--muted)}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tile:focus-visible,.bk:focus-visible,.hm:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:start;font:inherit;color:inherit;width:100%}
.pcard b{font-size:15.5px;overflow-wrap:anywhere}.pcard small{color:var(--muted);font-size:12.5px;grid-column:1}
.pcard .pill{grid-row:1/3;grid-column:2}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;border:1px solid currentColor;width:fit-content;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0;max-width:72ch}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f span.req::after{content:" *";color:var(--gold)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--gold)}
.ltr{direction:ltr;text-align:left}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.dc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0;background:var(--surface)}
.file{font-size:12.5px;color:var(--muted);word-break:break-all}.file a{color:var(--gold)}
.drop{border:1.5px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;position:relative;display:block;background:var(--gold-soft)}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{background:var(--soft);font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;direction:ltr;white-space:nowrap}
tr.hl td{background:var(--gold-soft)}
td input{padding:5px 7px;font-size:13px}
.checks{display:grid;gap:6px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 11px;border-radius:10px;font-size:14px}
.chk.ok{background:var(--ok-soft)}.chk.warn{background:var(--warn-soft)}.chk.bad{background:var(--bad-soft)}
.chk i{font-style:normal;font-weight:700;font-family:var(--mono)}
.chk.ok i{color:var(--ok)}.chk.warn i{color:var(--warn)}.chk.bad i{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:500;direction:ltr;display:inline-block}
.doclist{display:grid;gap:10px}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.docrow p{margin:0;font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:90vw;background:var(--nav);color:#f2dfa8;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 12px;border-radius:10px;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.busy{color:var(--gold);font-size:13px}
.mark{font-size:12.5px;color:var(--muted)}
/* app navigation: bottom bar on phones, dark side bar on desktop */
#appnav{position:fixed;z-index:30;background:var(--surface);left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.nvlogo{display:none}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;font:inherit;font-size:10.5px;color:var(--muted);cursor:pointer;padding:4px 0;position:relative;-webkit-tap-highlight-color:transparent}
.nv svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv.on{color:var(--ink);font-weight:700}.nv.on svg{stroke:var(--gold)}
.nv .pl{width:54px;height:54px;border-radius:18px;background:var(--nav);display:grid;place-items:center;margin-top:-30px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.nv.plus svg{stroke:#c9a24a;width:26px;height:26px;stroke-width:2.2}
@media (min-width:900px){
 #appnav{top:0;bottom:0;right:0;left:auto;width:210px;height:auto;background:var(--nav);padding:22px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border:0;box-shadow:none}
 .nvlogo{display:block;font-family:var(--brand);font-weight:700;letter-spacing:.16em;color:#c9a24a;font-size:15px;direction:ltr;margin:0 8px 18px;line-height:1.15;text-align:right}
 .nvlogo small{display:block;font-size:7.5px;letter-spacing:.5em;opacity:.8}
 .nv{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;color:var(--nav-ink);padding:11px 14px;border-radius:12px;width:100%}
 .nv svg{width:20px;height:20px}.nv.on{background:var(--nav-on);color:#fff}.nv.on svg{stroke:#c9a24a}
 .nv .pl{width:auto;height:auto;background:none;margin:0;box-shadow:none;display:contents}
 .nv.plus{order:99;margin-top:auto;background:#b08d3c;color:#141210;font-weight:700;justify-content:center}.nv.plus svg{stroke:#141210}
 body{padding-right:210px}
 .wrap{padding-bottom:40px}
 .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.login{max-width:420px;margin:8vh auto 0;display:grid;gap:14px;text-align:center}.lg-brand{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--gold)}.lg-brand small{display:block;font-size:12px;letter-spacing:.5em;color:var(--ink)}.login .f{text-align:left}
body.lg{padding-right:0!important}select{appearance:auto}
.tile.done{background:var(--ok-soft);border-color:transparent}.tile.done .ic{background:var(--ok);color:#fff;font-weight:700}.tile .ic{font-weight:700;color:var(--gold)}.tile:disabled{opacity:.5;cursor:default}
tr.mute td{color:var(--muted)}pre.mail{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;background:var(--soft);border-radius:10px;padding:10px;margin:8px 0}
@media (max-width:520px){.home{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:18px}}</style>

<body>
<nav id="appnav" aria-label="Navigation">
  <div class="nvlogo">FRAGRANCE HUB<small>MANUFAKTUR</small></div>
  <button class="nv" id="nv-home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg><span>Produkte</span></button>
  <button class="nv plus" id="nv-neu" type="button"><span class="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Neues Produkt</span></button>
  <button class="nv" id="nv-einst" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Einstellungen</span></button>
</nav>
<div class="wrap">
  <header class="top"><h1><span class="bn">FRAGRANCE HUB<small>GERMANY</small></span><span class="bs">Manufaktur · Fertigparfum für Kunden</span></h1></header>
  <main id="view"><div class="empty"><h2>Wird geladen…</h2></div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ---------- FH Manufaktur: Serververbindung, Anmeldung, Speicher ---------- */
const FH=(()=>{
  const API=(window.FHM_CONFIG||{}).api||'';
  const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
  let PIN=ls.get('fhm_pin');const me={user:'',admin:false};
  const ERR={PIN:'Zugangscode ist falsch.',NUR_INHABER:'Diese Funktion ist nur für den Inhaber.',AI_FEHLT:'Automatisches Auslesen ist nicht aktiviert.','Zu viele Versuche':'Zu viele Fehlversuche – bitte 10 Minuten warten.'};
  const errText=m=>ERR[m]||m;
  async function call(action,args,tries=3){if(!API)throw{code:'server_unavailable',message:'Serveradresse fehlt.'};let last;
    for(let i=0;i<tries;i++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:PIN,action,args:args||{}}),redirect:'follow'});
        if(!r.ok)throw{net:1,code:'server_unavailable',message:'Server antwortet nicht ('+r.status+')'};const j=await r.json();
        if(j.err){if(j.err==='PIN'&&action!=='check'){logout();}throw{code:'tool_error',raw:j.err,message:errText(j.err)}}return j.val}
      catch(e){last=e.code?e:{net:1,code:'server_unavailable',message:'Keine Verbindung zum Server – Internet prüfen.'};if(!last.net||i===tries-1)throw last;await new Promise(r=>setTimeout(r,1500*(i+1)))}}throw last}
  function logout(){ls.set('fhm_pin','');PIN='';location.reload()}
  async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  const subs={},cache={};
  async function pull(col){try{const rows=await call('list',{col});const sig=JSON.stringify(rows.map(r=>[r.id,r.updated]));if(cache[col]&&cache[col].sig===sig&&cache[col].ok)return;cache[col]={sig,rows,ok:1};(subs[col]||[]).forEach(f=>f(rows))}catch(e){(subs[col]||[]).forEach(f=>f(null,e))}}
  function sub(col,fn){(subs[col]=subs[col]||[]).push(fn);if(cache[col])fn(cache[col].rows);else pull(col)}
  setInterval(()=>{if(document.visibilityState==='visible'&&PIN)Object.keys(subs).forEach(pull)},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&PIN)Object.keys(subs).forEach(pull)});
  const snap=rows=>({docs:rows.map(r=>({id:r.id,data:()=>JSON.parse(JSON.stringify(r.data))}))});
  const local=(col,id,data)=>{const c=cache[col]||(cache[col]={sig:'',rows:[],ok:0});const rows=c.rows.filter(r=>r.id!==id);if(data!==null)rows.push({id,data:JSON.parse(JSON.stringify(data)),updated:Date.now()});c.rows=rows;c.ok=0;(subs[col]||[]).forEach(f=>f(rows))};
  const after=col=>{if(cache[col])cache[col].ok=0;clearTimeout(after['t'+col]);after['t'+col]=setTimeout(()=>pull(col),1500)};
  const db={
    collection:col=>({
      onSnapshot:(cb,err)=>sub(col,(rows,e)=>{if(rows)cb(snap(rows));else if(err)err({code:e&&e.message||'offline'})}),
      add:async data=>{const r=await call('add',{col,data});local(col,r.id,data);after(col);return{id:r.id}},
      doc:id=>({set:async data=>{await call('set',{col,id,data});local(col,id,data);after(col)},delete:async()=>{await call('del',{col,id});local(col,id,null);after(col)}})}),
    doc:path=>{const [col,id]=path.split('/');return{
      onSnapshot:cb=>sub(col,rows=>{if(!rows)return;const r=rows.find(x=>x.id===id);cb({exists:!!r,data:()=>r?JSON.parse(JSON.stringify(r.data)):undefined})}),
      set:async data=>{await call('set',{col,id,data});local(col,id,data);after(col)}}}};
  const upload=async file=>{const r=await call('upload',{name:file.name||'Datei',type:file.type||'application/octet-stream',data:await b64(file)},1);return{id:r.id,url:r.url}};
  const ai=async(prompt,images)=>{const im=[];for(const x of (images||[]))im.push({type:x.type||'image/jpeg',data:await b64(x)});return call('ai',{prompt,images:im},1)};
  function loginView(msg){return `<div class="card login"><div class="lg-brand">FRAGRANCE HUB<small>MANUFAKTUR</small></div>
    <p class="hint">Fertigparfum für Kunden · Spezifikation · Sicherheitsbewertung · CPNP</p>
    <label class="f" for="lgPin"><span>Zugangscode</span><input id="lgPin" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>
    ${msg?`<div class="chk bad"><i>✕</i><span>${msg}</span></div>`:''}<button class="btn primary" type="button" id="lgGo">Anmelden</button></div>`}
  function login(){return new Promise(async done=>{const nav=document.getElementById('appnav');
    const show=msg=>{nav.style.display='none';document.body.classList.add('lg');const v=document.getElementById('view');v.innerHTML=loginView(msg);const i=document.getElementById('lgPin');i.focus();
      const go=async()=>{const p=i.value.trim();if(!p)return;PIN=p;document.getElementById('lgGo').disabled=true;try{Object.assign(me,await call('check',{},2));ls.set('fhm_pin',p);nav.style.display='';document.body.classList.remove('lg');done(true)}catch(e){PIN='';show(e.message)}};
      document.getElementById('lgGo').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}};

function get(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)??''}
function set(o,path,v){const ks=path.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a=a[k]=a[k]||{}});a[ks.at(-1)]=v}
function field(path,label,o={}){const p=curP();const v=get(p,path);const id='f_'+path.replace(/\./g,'_');
  if(o.opts)return `<label class="f" for="${id}"><span>${label}</span><select id="${id}" data-path="${path}">${o.opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
  return `<label class="f" for="${id}"><span class="${o.req?'req':''}">${label}</span><input id="${id}" class="${o.num?'num':''}" data-path="${path}" value="${esc(v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.num?'inputmode="decimal"':''} ${o.ro?'readonly':''}>${o.help?`<small class="mark">${o.help}</small>`:''}</label>`}
const chkList=(L,k)=>{const x=L.filter(i=>!k||i.step===k);return `<div id="chkBox" data-k="${k||''}">`+(x.length?`<div class="checks">${x.map(i=>`<div class="chk ${i.lvl}"><i>${i.lvl==='ok'?'✓':i.lvl==='warn'?'!':'✕'}</i><span>${esc(i.t)}</span></div>`).join('')}</div>`:'')+'</div>'};
function refreshChecks(){const b=$('#chkBox'),p=curP();if(!b||!p)return;const k=b.dataset.k||'';b.outerHTML=chkList(checks(p,compute(p)),k)}

ich hoffe, es geht Ihnen gut.

${intro}

Verantwortliche Person: ${K.firma}, ${K.strasse}, ${K.ort}

${list.map(block).join('\n\n')}

Anlagen:
${list.map(p=>`– Produktspezifikation ${p.code} (PDF)`).join('\n')}${att.oils.filter(o=>o.on).map(o=>`\n– Duftöl ${o.ref}: Sicherheitsdatenblatt mit IFRA-Zertifikat und Allergenerklärung`).join('')}${att.alc.on?'\n– Datenblatt des Alkohols (Alcohol denat.)':''}${att.oils.filter(o=>!o.on&&o.known).map(o=>`\n(Unterlagen zum Duftöl ${o.ref} liegen Ihnen bereits vor.)`).join('')}${!att.alc.on&&att.alc.known?'\n(Das Datenblatt des Alkohols liegt Ihnen bereits vor.)':''}

Wenn Ihnen etwas auffällt oder Sie noch Angaben brauchen, geben Sie mir einfach kurz Bescheid.

Vielen Dank für Ihre Unterstützung und herzliche Grüße
${s.contact?s.contact+'\n':''}${s.company}
${s.street}, ${s.city}
${s.phone} · ${s.email}`;return{subj,body}}

  <p class="mark">Der Button lädt ${sel.length>1?'die PDFs':'das PDF'} herunter und öffnet eine fertige E-Mail im Mailprogramm. ${sel.length>1?'PDFs':'PDF'} anhängen und senden – der Status wird auf „Beim Sicherheitsbewerter“ gesetzt.</p>

  pane.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('input',()=>{set(p,el.dataset.path,el.value);if(el.dataset.path==='cpnp.nr'){p.cpnp.at=el.value?Date.now():0;p.status=el.value?'registriert':(p.cpsr&&p.cpsr.fileId?'bewertet':p.status)}save(p)});el.addEventListener('change',()=>setTimeout(()=>{const ae=document.activeElement;if(ae&&ae!==el&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$('#pane').contains(ae))refreshChecks();else render()},0))});
  const i4=$('#ifra4');if(i4)i4.addEventListener('input',()=>{p.ifra.cats={...(p.ifra.cats||{}),'4':i4.value};save(p)});
  pane.querySelectorAll('[data-al]').forEach(el=>el.addEventListener('input',()=>{p.allergen.items[+el.dataset.al][el.dataset.f]=el.value;p.allergen.checked=false;save(p)}));

async function downloadDrive(f){const r=await FH.call('drive_download',{fileId:f.id},2);const b64=r&&(r.content||r.data);if(!b64)throw new Error('leer');

function resetCerts(p){p.ifra={amendment:'',date:'',cats:{},checked:false,fileId:'',fileName:'',fileUrl:''};p.allergen={date:'',reg2023:false,items:[],checked:false,fileId:'',fileName:'',fileUrl:''};p.sds={date:'',appearance:'',fileId:'',fileName:'',fileUrl:''};p.certSrc=null}
async function pickOil(p,x){if(!x)return;const pq=/-PQ-SH$/i.test(x.code);Object.assign(p,{oilName:x.name+(pq?' (Premium)':''),oilCode:x.code,factoryCode:x.fc});resetCerts(p);state.pickQ='';save(p);render();
  if(x.fc)await fetchCerts(p);else toast('Keine Werks-Nr. – Zertifikat hochladen')}
const PROMPTS={
 ifra:`You read an IFRA Certificate of Conformity for a fragrance oil. Copy values exactly as printed; never guess; null when absent.
Reply with only JSON: {"amendment":number|null,"date":string|null,"categories":{"1":v,"2":v,"3":v,"4":v,"5A":v,"5B":v,"5C":v,"5D":v,"6":v,"7A":v,"7B":v,"8":v,"9":v,"10A":v,"10B":v,"11A":v,"11B":v,"12":v}}
Each v is the maximum % of this fragrance in the finished product for that IFRA category as a number, the string "no restriction" if the certificate says so, or null if not stated. A comma is a decimal separator.`,
 allergen:`You read a fragrance allergen declaration for a fragrance oil. Copy values exactly as printed; never guess.
Reply with only JSON: {"date":string|null,"mentions_2023_1545":boolean,"items":[{"name":string,"cas":string|null,"percent":number|null}]}
Include EVERY row, also not-detected rows (percent 0). percent = % w/w in the oil; ppm/mg/kg -> divide by 10000. A comma is a decimal separator.`,
 sds:`You read a Safety Data Sheet (SDS) of a fragrance oil. Copy values exactly as printed; never guess; null when absent.
Reply with only JSON: {"revision_date":string|null,"appearance":string|null}`};
const KINDS=['ifra','allergen','sds'];const KNAME={ifra:'IFRA',allergen:'Allergene',sds:'SDS'};
async function fetchCerts(p){const code=String(p.factoryCode||'').trim();if(!code)return;const key=p.id+'oel';state.drive[p.id]={msg:''};
  state.busy[key]='Sucht Zertifikat '+code+' in Google Drive…';render();
  try{let pick=null;try{const reg=await FH.call('cert_lookup',{code},2);if(reg&&reg.en)pick={id:reg.en.id,title:reg.en.title,url:'https://drive.google.com/file/d/'+reg.en.id+'/view'}}catch(e){}
    if(!pick){const r=await FH.call('drive_search',{query:`title contains '${code.replace(/'/g,"\\'")}' and mimeType = 'application/pdf' and trashed = false`,excludeContentSnippets:true,pageSize:20},3);
      const fs=((r&&r.files)||[]).filter(f=>String(f.title||'').includes(code)&&!/Zertifikat|Etikett|CLP|Sicherheitsdatenblatt|Berechnungsprotokoll/i.test(f.title)).sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)));
      const en=fs.filter(f=>!/de-DE|deutsch|[\s_-]de\.pdf$/i.test(f.title));const f=en[0]||fs[0];if(f)pick={id:f.id,title:f.title,url:f.viewUrl||''}}
    if(!pick){state.drive[p.id].msg='Kein Zertifikat mit '+code+' in Google Drive gefunden – PDF hochladen.';return}
    p.certSrc={id:pick.id,title:pick.title,url:pick.url};KINDS.forEach(k=>Object.assign(p[k],{fileId:pick.id,fileName:pick.title,fileUrl:pick.url}));save(p);
    state.busy[key]='Liest IFRA und Allergene…';render();
    const prompts={};KINDS.forEach(k=>prompts[k]=PROMPTS[k]+'\nThe file may combine several documents; use only the part matching this document type.');
    const r=await FH.call('read_drive',{fileId:pick.id,prompts},1);const res=(r&&r.results)||{};const bad=[];
    KINDS.forEach(k=>{const v=res[k];if(v&&!v.error)apply(p,k,v);else if(k!=='sds')bad.push(KNAME[k])});save(p);
    toast(bad.length?'Nicht gelesen: '+bad.join(', ')+' – bitte von Hand eintragen':'Zertifikat gelesen – Werte mit dem Original vergleichen')}
  catch(e){state.drive[p.id].msg='Lesen fehlgeschlagen: '+(e.message||e)}finally{delete state.busy[key];render()}}
async function pdfPages(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];
  for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();let out='',last=null,line='';for(const it of tc.items){const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>2){out+=line+'\n';line=''}line+=(line?' ':'')+it.str;last=y}pages.push(out+line)}return{pdf,pages}}
async function pageImages(pdf,nums){const out=[];for(const i of nums.slice(0,6)){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;let q=.9,b;do{b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));q-=.15}while(b.size>3500000&&q>.3);out.push(b)}return out}
const PAGE_RE={ifra:/IFRA/i,allergen:/allergen|2023\/1545|ANNEX\s*III|ANHANG\s*III|Isomethyl\s*Ionone|Hydroxycitronellal/i,sds:/Safety\s+Data\s+Sheet|Sicherheitsdatenblatt/i};
async function uploadCert(p,file){const key=p.id+'up';if(file.size>20*1024*1024){toast('Datei größer als 20 MB');return}
  state.busy[key]='Wird gespeichert…';render();
  try{const up=await FH.upload(file);resetCerts(p);if(!p.factoryCode)p.factoryCode=(String(file.name).match(/\b\d{7}\b/)||[''])[0];p.certSrc={id:up.id,title:file.name,url:up.url||''};p.expertCert={id:up.id,url:up.url||'',name:file.name};
    KINDS.forEach(k=>Object.assign(p[k],{fileId:up.id,fileName:file.name,fileUrl:up.url||''}));save(p);
    state.busy[key]='Öffnet PDF…';render();const {pdf,pages}=await pdfPages(file);
    for(const k of KINDS){state.busy[key]='Liest '+KNAME[k]+'…';render();
      const nums=pages.map((t,i)=>PAGE_RE[k].test(t)?i+1:0).filter(Boolean);const use=nums.length?[...new Set(nums.flatMap(n=>n<pages.length?[n,n+1]:[n]))]:pages.map((_,i)=>i+1);
      const text=use.map(n=>`--- Seite ${n} ---\n`+pages[n-1]).join('\n\n');
      try{const imgs=await pageImages(pdf,use);apply(p,k,await FH.ai(PROMPTS[k]+'\nThe file may combine several documents; use only the part matching this document type.\nYou get page images and an OCR text layer; trust the images for numbers.\n\nDocument text:\n'+text.slice(0,180000),imgs))}catch(e){if(k!=='sds')toast('Nicht gelesen: '+KNAME[k])}}
    save(p);toast('Zertifikat gelesen – Werte mit dem Original vergleichen')}
  catch(e){toast('Hochladen fehlgeschlagen: '+(e.message||e.code||e))}finally{delete state.busy[key];render()}}
function apply(p,k,r){if(!r||typeof r!=='object')return;
  if(k==='ifra'){p.ifra.amendment=r.amendment??'';p.ifra.date=r.date??'';const cats={};Object.entries(r.categories||{}).forEach(([a,v])=>{if(v!==null&&v!==undefined)cats[a]=String(v)});p.ifra.cats=cats}
  if(k==='allergen'){p.allergen.date=r.date??'';p.allergen.reg2023=!!r.mentions_2023_1545;p.allergen.checked=false;p.allergen.items=(r.items||[]).map(a=>({name:String(a.name||''),cas:a.cas?String(a.cas):'',pct:a.percent==null?'':String(a.percent)}))}
  if(k==='sds'){p.sds.date=r.revision_date??'';p.sds.appearance=r.appearance??''}}

const pdfSafe=s=>String(s??'').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->').replace(/[^\x00-\xFF€–—‘’“”•…]/g,'?');
const nf=(v,d)=>v===null||v===undefined||!isFinite(v)?'—':Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
function newDoc(){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const M=16,W=210-2*M;const ink=[24,22,20],mut=[107,100,90];let y=M;const T=pdfSafe;const need=h=>{if(y+h>280){doc.addPage();y=M+4}};
  const H1=t=>{need(14);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...ink);doc.setFillColor(243,233,207);doc.rect(M,y-4.5,W,7,'F');doc.text(T(t),M+2,y);y+=7};
  const H2=t=>{need(9);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...ink);doc.text(T(t),M,y);y+=5};
  const P=(t,o={})=>{doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||8.8);doc.setTextColor(...(o.muted?mut:ink));for(const ln of doc.splitTextToSize(T(t),W)){need(4.4);doc.text(ln,M,y);y+=4.1}y+=1.2};
  const KV=rows=>{doc.autoTable({startY:y,body:rows.map(r=>r.map(T)),margin:{left:M,right:M},theme:'plain',styles:{font:'helvetica',fontSize:8.6,cellPadding:1.1,textColor:ink},columnStyles:{0:{cellWidth:62,fontStyle:'bold'}}});y=doc.lastAutoTable.finalY+3};
  const TB=(head,body,cols)=>{doc.autoTable({startY:y,head:[head.map(T)],body:body.map(r=>r.map(T)),margin:{left:M,right:M},theme:'grid',styles:{font:'helvetica',fontSize:8,cellPadding:1.4,textColor:ink,lineColor:[220,213,200],lineWidth:.2},headStyles:{fillColor:[243,233,207],textColor:ink,fontStyle:'bold'},columnStyles:cols||{}});y=doc.lastAutoTable.finalY+4};
  return{doc,M,W,ink,mut,H1,H2,P,KV,TB,get y(){return y},set y(v){y=v}}}
async function pdfSpec(p,quiet){if(!window.jspdf){toast('PDF-Bibliothek nicht geladen – Seite neu laden');return}
  const s=state.settings,c=compute(p),K=p.kunde||{},A=s.alcohol||{};const D=newDoc();const {doc,M}=D;
  const cust=[K.firma,K.strasse,K.ort,K.telefon?'T.: '+K.telefon:''].filter(Boolean);const pn=p.name||p.code;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...D.ink);doc.text('PRODUCT SPECIFICATION',M,D.y+6);
  doc.autoTable({startY:D.y,margin:{left:118,right:M},theme:'grid',body:[['Document Code',s.docCode||'FR.SPC.01'],['First Release Date',p.doc.first||deDate()],['Revision Date',p.doc.rev||p.doc.first||deDate()],['Revision Number',p.doc.revNo||'1']].map(r=>r.map(pdfSafe)),styles:{font:'helvetica',fontSize:8,cellPadding:1.2,textColor:D.ink,lineColor:[220,213,200],lineWidth:.2},columnStyles:{0:{fontStyle:'bold',fillColor:[243,233,207]}}});
  D.y=doc.lastAutoTable.finalY+4;cust.forEach((t,i)=>{doc.setFont('helvetica',i?'normal':'bold');doc.setFontSize(9);doc.text(pdfSafe(t),210-M,D.y,{align:'right'});D.y+=4.2});D.y+=3;
  D.H1('Product info');D.KV([['Brand',p.marke||K.firma],['Product name',pn],['Product code',p.code],['Product type',`${p.typ} (hydroalcoholic fine fragrance, spray)`],['Responsible person',cust.join(', ')]]);

  D.TB(['Raw material','% w/w'],[[`Alcohol denat. (${A.name||'Ethanol'}${ethWW!==null?`, ethanol ${nf(ethWW,1)} % w/w`:''}${(A.denats||[]).length?', denatured with '+A.denats.map(x=>x.name).filter(Boolean).join(' + '):''})`,nf(c.alc,2)+' %'],[`Fragrance oil ${oilRef(p)}`,nf(c.oil,2)+' %'],['Total','100.00 %']],{1:{halign:'right',cellWidth:30}});

  D.H2(`Fragrance allergens (oil content ${nf(c.oil,2)} %)`);
  D.TB(['Substance','CAS','% in raw material','% in final product','Declaration'],c.al.map(a=>[a.name,a.cas,nf(a.pin,3),nf(a.prod,4),a.decl?'Declared':'Not declared']),{2:{halign:'right'},3:{halign:'right'},4:{cellWidth:24}});
  D.P(`% in final product = % in raw material x ${nf(c.oil,2)} / 100. Values from the SDS and allergen declaration of the fragrance oil${p.allergen.date?' ('+p.allergen.date+')':''}.`,{size:8,muted:1});
  D.P('Allergens above 0.001 % in the finished leave-on product are declared on the label (Regulation (EC) No 1223/2009, Annex III; Regulation (EU) 2023/1545).',{size:8,muted:1});
  D.H1('Physical characteristics');D.KV([['Packaging',`${p.mengen} glass bottle with spray pump`],['Colour',p.farbe||'—'],['Form','Liquid'],['Appearance',p.sds.appearance||'Clear liquid'],['Odour','Characteristic'],['pH value','Not applicable (hydroalcoholic product)'],['Flammability',c.eth!==null&&c.eth>=50?'Highly flammable':'Flammable']]);
  D.H1('Chemical characteristics');D.P('See safety data sheets of the raw materials (fragrance oil and alcohol).');
  D.H1('Primary and secondary packaging');D.KV([['Glass bottle',`Supplier: ${s.company}; fill volume ${p.mengen}; soda-lime glass (SiO2, Na2O, CaO)`],['Spray pump and cap',`Supplier: ${s.company}${p.pumpe?'; model '+p.pumpe:''}; sealing materials PE/PP/silicone`],['Conformity','Bottle and spray pump are made of materials suitable for cosmetics. No interaction or migration into the product is known.']]);
  D.H1('Microbiological quality and preservation');D.P(c.eth!==null&&c.eth>=20?`Ethanol content ${nf(c.eth,1)} % w/w (above 20 %): the product is of low microbiological risk. A preservative efficacy test (challenge test) according to ISO 29621 is not required.`:'Ethanol content below 20 %: microbiological risk to be assessed.');
  D.H1('Shelf life and storage');D.P(p.stabil?'The finished product shows stable odour, density and colour at room temperature and under accelerated ageing (40 °C, 3 months).':'Stability testing at room temperature and under accelerated ageing (40 °C, 3 months) is in progress. The shelf life is based on the stability of the raw materials and the high ethanol content.');
  D.KV([['Date of minimum durability',`${c.mhd} months`],['Period after opening (PAO)',`${c.pao} months (${c.pao}M)`],['Storage','Tightly closed, at max. 25 °C, away from heat, flames and direct sunlight']]);
  D.H1('Manufacturing and GMP');D.P(`Manufacturing site: ${s.company}, ${s.street}, ${s.city}.`);
  [['Step 1',`Weighing of the denatured alcohol (${nf(c.alc,2)} % w/w).`],['Step 2',`Addition of the fragrance oil (${nf(c.oil,2)} % w/w) and thorough mixing until complete homogenisation.`],['Step 3','Maceration: storage of the mixture in closed containers (e.g. 2 to 8 weeks at controlled room temperature) for olfactory stabilisation.'],['Step 4','Optional chilling (4-8 °C) followed by fine filtration to remove precipitated waxes or insoluble compounds.'],['Step 5','Filling into the glass bottles and sealing under hygienic conditions; batch number on every unit.']].forEach(([a,b])=>D.P(`${a}: ${b}`));
  D.P('Manufacturing is conducted in compliance with Good Manufacturing Practice for cosmetics according to DIN EN ISO 22716.',{bold:1});
  D.H1('Toxicological profile and exposure data');D.KV([['Target group','Adults (men/women)'],['Area of application','Intact skin (neck, wrists, behind the ears)'],['Application type','Leave-on product'],['Daily exposure (SCCS Notes of Guidance, hydroalcoholic fragrance)','0.28 g/day; retention factor 1; 4.67 mg/kg bw/day (60 kg body weight)']]);
  D.H1('Allergens and usage instructions');D.P(`The product contains fragrance allergens subject to declaration under Regulation (EC) No 1223/2009 in concentrations above 0.001 %: ${c.decl.map(a=>a.name).join(', ')||'none'}. They are listed in the INCI declaration on the packaging.`);
  D.P('Do not spray into eyes or mouth. Do not apply to mucous membranes or broken skin. Discontinue use if irritation occurs. External use only. Keep away from heat and flame.');
  D.H1('Origin');D.P('Europe - Germany');
  D.H1('Legal requirements');D.P(['Regulation (EC) No 1223/2009 (cosmetic products)','Regulation (EC) No 1907/2006 (REACH) and Commission Regulation (EU) 2020/878','Regulation (EC) No 1272/2008 (CLP)','Commission Regulation (EU) 2023/1545 (fragrance allergens)','Commission Regulation (EU) 2018/605','Directive 2008/98/EC (waste)','Commission Regulation (EU) 2022/692','Regulation (EU) 2019/1148'].join('\n'));
  D.H1('Labelling');D.P('Ingredients: '+c.label.join(', ')+'.',{bold:1});
  D.H2('Warnings (EN)');D.P('For external use only. Avoid contact with eyes. Keep away from heat and flame. Keep out of reach of children.');
  D.H2('Hinweise (DE)');D.P(['Nur zur äußeren Anwendung.','Kontakt mit den Augen vermeiden. Bei Augenkontakt sofort mit viel Wasser ausspülen.','Nicht auf gereizte oder verletzte Haut auftragen.','Nicht im Lippen- und Mundbereich anwenden.','Bei Hautreizung oder allergischer Reaktion die Anwendung beenden.','Außerhalb der Reichweite von Kindern aufbewahren.','Von Hitze und Flamme fernhalten.'].join('\n'));
  D.H2('Marking (to be confirmed by the client before shipment)');
  D.KV([['Brand',p.marke||K.firma],['Product name',pn],['Product code',p.code],['Lot number',p.lot||'see bottle'],['Production date','DD.MM.YYYY'],['Best before',`DD.MM.YYYY (${c.mhd} months)`],['PAO',`${c.pao}M`],['Production type','Handmade'],['Origin country','Germany'],['Storage','max. 25 °C'],['Nominal quantity',p.mengen],['Symbols','Flammable warning, recycling symbol, PAO symbol'],['Responsible person',cust.join(', ')]]);
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...D.mut);doc.text(pdfSafe(`Product Specification · ${K.firma} · ${p.code} · Rev. ${p.doc.revNo||'1'}`),M,290);doc.text(`${i} / ${n}`,210-M,290,{align:'right'})}
  const fn=`${p.code}_${String(pn).replace(/[^\w.-]+/g,'_')}_PRODUCT_SPECIFICATION_Rev${p.doc.revNo||'1'}.pdf`;const blob=doc.output('blob');const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);if(!quiet)toast('PDF erstellt');return{fn,blob}}

/* ---------- Start der App ---------- */
document.getElementById('nv-home').onclick=()=>navTo('home');document.getElementById('nv-neu').onclick=()=>{stack.length=1;go('neu')};document.getElementById('nv-einst').onclick=()=>navTo('einst');
(async()=>{
  if(!await FH.login())return;
  const db=FH.db;state.db=db;render();
  db.doc('config/settings').onSnapshot(sn=>{if(sn.exists){const d=sn.data()||{};const o=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));SET_KEYS.forEach(k=>{if(d[k]!==undefined&&d[k]!=='')o[k]=k==='alcohol'?{name:d.alcohol.name??o.alcohol.name,ethanolWW:d.alcohol.ethanolWW??o.alcohol.ethanolWW,denats:(d.alcohol.denats||o.alcohol.denats).map(x=>({name:x.name||'',cas:x.cas||'',pct:x.pct??''}))}:d[k]});state.settings=o;if(view().v!=='einst')render()}});
  db.collection('products').onSnapshot(qs=>{const local={};state.products.forEach(p=>local[p.id]=p);
    state.products=qs.docs.map(d=>({id:d.id,data:d.data()})).filter(x=>x.data&&x.data.kind==='cpsr').map(x=>state.pending[x.id]&&local[x.id]?local[x.id]:{...merge(blank(),x.data),id:x.id}).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    const ae=document.activeElement;const typing=ae&&$('#view').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);if(!typing)render()},e=>toast('Speicherfehler: '+e.code));
})();
})();
