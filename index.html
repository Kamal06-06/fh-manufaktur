<style>
/* Layout: same as the showroom app — one working column, full pages with «رجوع» and ⌂, bottom bar on phones, dark side bar on desktop; GHS red only for hazard marks */
:root{
  --bg:#f5f2eb; --surface:#ffffff; --ink:#1a1714; --muted:#6b645a; --line:#dcd5c8;
  --accent:#1a1714; --accent-ink:#f2dfa8; --gold:#b8912f; --gold-soft:#f3e9cf; --soft:#f1ebdc;
  --hz:#c8102e; --ok:#1d6b3a; --ok-soft:#e3f1e7; --warn:#a4560a; --warn-soft:#fbf0d4; --bad:#a12c2c; --bad-soft:#fbe4e1;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f;
  --sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --brand:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e0c; --surface:#1a1816; --ink:#ece6d8; --muted:#a39b8c; --line:#2f2b25;
  --accent:#c9a24a; --accent-ink:#161310; --gold:#d4ad55; --gold-soft:#2b2518; --soft:#262219;
  --hz:#ff6b7d; --ok:#63c487; --ok-soft:#17291d; --warn:#e2a04e; --warn-soft:#33270f; --bad:#ee8a8a; --bad-soft:#3a1b19;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e0c; --surface:#1a1816; --ink:#ece6d8; --muted:#a39b8c; --line:#2f2b25;
  --accent:#c9a24a; --accent-ink:#161310; --gold:#d4ad55; --gold-soft:#2b2518; --soft:#262219;
  --hz:#ff6b7d; --ok:#63c487; --ok-soft:#17291d; --warn:#e2a04e; --warn-soft:#33270f; --bad:#ee8a8a; --bad-soft:#3a1b19;
  --nav:#141210; --nav-ink:#cfc6b4; --nav-on:#2a251f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--gold)}
h1{margin:0;display:flex;flex-direction:column;line-height:1.25}
.bn{font-family:var(--brand);font-size:24px;font-weight:700;letter-spacing:.18em;color:var(--gold);direction:ltr;text-align:start;line-height:1.1}
.bn small{display:block;font-size:11px;letter-spacing:.42em;font-weight:600}
.bs{font-size:13px;font-weight:500;color:var(--muted)}
.shh{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.shh b{flex:1;min-width:0;text-align:center;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.hm{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
#view{display:flex;flex-direction:column;gap:12px;min-width:0}#delZone{align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:10px;text-align:start;padding:12px;min-height:64px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;width:100%}
.tile .ic{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.tile .ic svg{width:19px;height:19px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.tile b{font-size:15.5px}.tile span{font-size:12.5px;color:var(--muted)}
.tile.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.tile.primary span{color:var(--accent-ink);opacity:.8}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.btn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:46px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tile:focus-visible,.bk:focus-visible,.hm:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.pcard b{font-size:15.5px;overflow-wrap:anywhere}.pcard small{color:var(--muted);font-size:12.5px;grid-column:1}
.pcard .pill{grid-row:1/3;grid-column:2}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;border:1px solid currentColor;width:fit-content;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0;max-width:72ch}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f span.req::after{content:" *";color:var(--gold)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--gold)}
.ltr{direction:ltr;text-align:left}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.dc{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0;background:var(--surface)}
.file{font-size:12.5px;color:var(--muted);word-break:break-all}.file a{color:var(--gold)}
.drop{border:1.5px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;position:relative;display:block;background:var(--gold-soft)}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{background:var(--soft);font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;direction:ltr;white-space:nowrap}
tr.hl td{background:var(--gold-soft)}
td input{padding:5px 7px;font-size:13px}
.checks{display:grid;gap:6px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 11px;border-radius:10px;font-size:14px}
.chk.ok{background:var(--ok-soft)}.chk.warn{background:var(--warn-soft)}.chk.bad{background:var(--bad-soft)}
.chk i{font-style:normal;font-weight:700;font-family:var(--mono)}
.chk.ok i{color:var(--ok)}.chk.warn i{color:var(--warn)}.chk.bad i{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:500;direction:ltr;display:inline-block}
.ghsrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.ghsrow svg{width:64px;height:64px}
.hzline{direction:ltr;text-align:left;font-size:14px}.hzline b{font-family:var(--mono);font-weight:600;color:var(--hz)}
.why{font-size:12.5px;color:var(--muted);direction:ltr;text-align:left}
.doclist{display:grid;gap:10px}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.docrow p{margin:0;font-size:13px;color:var(--muted)}
.steps{display:grid;gap:10px}
.step{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--surface)}
.step.done{background:var(--ok-soft);border-color:transparent}
.step h3{margin-bottom:4px}.step p,.step li{font-size:14px;margin:0}
.step ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:3px}
.step .ltr{font-family:var(--mono);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:90vw;background:var(--nav);color:#f2dfa8;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 12px;border-radius:10px;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.busy{color:var(--gold);font-size:13px}
.mark{font-size:12.5px;color:var(--muted)}
/* app navigation: bottom bar on phones, dark side bar on desktop */
#appnav{position:fixed;z-index:30;background:var(--surface);left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.nvlogo{display:none}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;font:inherit;font-size:10.5px;color:var(--muted);cursor:pointer;padding:4px 0;position:relative;-webkit-tap-highlight-color:transparent}
.nv svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv.on{color:var(--ink);font-weight:700}.nv.on svg{stroke:var(--gold)}
.nv .pl{width:54px;height:54px;border-radius:18px;background:var(--nav);display:grid;place-items:center;margin-top:-30px;box-shadow:0 6px 18px rgba(0,0,0,.28)}

@media (min-width:900px){
 #appnav{top:0;bottom:0;right:0;left:auto;width:210px;height:auto;background:var(--nav);padding:22px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border:0;box-shadow:none}
 .nvlogo{display:block;font-family:var(--brand);font-weight:700;letter-spacing:.16em;color:#c9a24a;font-size:15px;direction:ltr;margin:0 8px 18px;line-height:1.15;text-align:right}
 .nvlogo small{display:block;font-size:7.5px;letter-spacing:.5em;opacity:.8}
 .nv{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;color:var(--nav-ink);padding:11px 14px;border-radius:12px;width:100%}
 .nv svg{width:20px;height:20px}.nv.on{background:var(--nav-on);color:#fff}.nv.on svg{stroke:#c9a24a}
 .nv .pl{width:auto;height:auto;background:none;margin:0;box-shadow:none;display:contents}
 .nv.plus{order:99;margin-top:auto;background:#b08d3c;color:#141210;font-weight:700;justify-content:center}.nv.plus svg{stroke:#141210}

 .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ---------- FH Manufaktur: server connection, login, storage ---------- */
const FH=(()=>{
  const API=(window.FHM_CONFIG||{}).api||'';
  const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
  let PIN=ls.get('fhm_pin');const me={user:'',admin:false};
  const ERR={PIN:'رمز الدخول غير صحيح.',NUR_INHABER:'هذه العملية للمالك فقط.',AI_FEHLT:'القراءة الآلية غير مفعّلة بعد — أخبر المسؤول.',SHOP_FEHLT:'الربط مع المتجر غير مفعّل بعد — أخبر المسؤول.','Zu viele Versuche':'محاولات خاطئة كثيرة — انتظر 10 دقائق.'};
  const errText=m=>ERR[m]||m;
  async function call(action,args,tries=3){if(!API)throw{code:'server_unavailable',message:'عنوان الخادم غير مضبوط.'};let last;
    for(let i=0;i<tries;i++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:PIN,action,args:args||{}}),redirect:'follow'});
        if(!r.ok)throw{net:1,code:'server_unavailable',message:'الخادم لا يستجيب ('+r.status+')'};const j=await r.json();
        if(j.err){if(j.err==='PIN'&&action!=='check'){logout();}throw{code:'tool_error',raw:j.err,message:errText(j.err)}}return j.val}
      catch(e){last=e.code?e:{net:1,code:'server_unavailable',message:'لا اتصال بالخادم — تحقق من الإنترنت.'};if(!last.net||i===tries-1)throw last;await new Promise(r=>setTimeout(r,1500*(i+1)))}}throw last}
  function logout(){ls.set('fhm_pin','');PIN='';location.reload()}
  async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  /* storage with live refresh */
  const subs={},cache={};
  async function pull(col){try{const rows=await call('list',{col});const sig=JSON.stringify(rows.map(r=>[r.id,r.updated]));if(cache[col]&&cache[col].sig===sig&&cache[col].ok)return;cache[col]={sig,rows,ok:1};(subs[col]||[]).forEach(f=>f(rows))}catch(e){(subs[col]||[]).forEach(f=>f(null,e))}}
  function sub(col,fn){(subs[col]=subs[col]||[]).push(fn);if(cache[col])fn(cache[col].rows);else pull(col)}
  setInterval(()=>{if(document.visibilityState==='visible'&&PIN)Object.keys(subs).forEach(pull)},30000);

  list(/H351/).forEach(i=>{if(i.max>=1)add('H351',`${i.name} ${fmtSig(i.max)} % (Carc. 2, >= 1 %).`)});
  list(/H341/).forEach(i=>{if(i.max>=1)add('H341',`${i.name} ${fmtSig(i.max)} % (Muta. 2, >= 1 %).`)});
  // aquatic (summation with M-factors)
  const c1=ings.filter(i=>/H410/.test(i.hazard)).reduce((a,i)=>a+i.max*i.m,0);
  const c2=sum(/H411/),c3=sum(/H412/),c4=sum(/H413/),a1=ings.filter(i=>/H400/.test(i.hazard)).reduce((a,i)=>a+i.max*i.m,0);
  if(c1>=25)add('H410',`Σ Chronic 1 × M = ${fmt(c1,2)} % (>= 25 %).`);
  else if(10*c1+c2>=25)add('H411',`Σ 10 × Chronic 1 × M + Chronic 2 = ${fmt(10*c1+c2,2)} % (>= 25 %).`);
  else if(100*c1+10*c2+c3>=25)add('H412',`Σ 100 × Chronic 1 × M + 10 × Chronic 2 + Chronic 3 = ${fmt(100*c1+10*c2+c3,2)} % (>= 25 %).`);
  else if(c1+c2+c3+c4>=25)add('H413',`Σ Chronic 1–4 = ${fmt(c1+c2+c3+c4,2)} % (>= 25 %).`);
  if(a1>=25&&!H.has('H410'))add('H400',`Σ Acute 1 × M = ${fmt(a1,2)} % (>= 25 %).`);
  // pictograms / signal word
  const pic=new Set();if(H.has('H225')||H.has('H226'))pic.add('GHS02');if(H.has('H318'))pic.add('GHS05');
  if(['H304','H360','H361','H351','H341'].some(h=>H.has(h)))pic.add('GHS08');
  if(['H317','H315','H319','H336'].some(h=>H.has(h))&&!(pic.has('GHS05')&&!H.has('H317')))pic.add('GHS07');
  if(['H400','H410','H411'].some(h=>H.has(h)))pic.add('GHS09');
  const danger=['H225','H304','H318','H360'].some(h=>H.has(h));const signal=H.size?(danger?'Gefahr':'Achtung'):'';

  const P=[];const ap=c=>{if(!P.includes(c))P.push(c)};
  if(H.has('H304'))ap('P301+P310');if(H.has('H225'))ap('P210');if(H.size)ap('P280');if(H.has('H304'))ap('P331');
  if(H.has('H319'))ap('P305+P351+P338');if(H.has('H318'))ap('P305+P351+P338');if(H.has('H317'))ap('P333+P313');
  if(H.has('H225'))ap('P303+P361+P353');if(H.has('H360')||H.has('H361'))ap('P308+P313');if(H.has('H410')||H.has('H411'))ap('P273');
  if(H.has('H225'))ap('P403+P235');if(H.size)ap('P501');

  return{H:hl,labelH,why,pic:['GHS02','GHS05','GHS07','GHS08','GHS09'].filter(x=>pic.has(x)),signal,P,labelP:P.slice(0,6),sensNames:trig.map(i=>i.name),euh208:euh.map(i=>i.name),r2low,

function checks(p,s,c){
  const L=[];const add=(lvl,t)=>L.push({lvl,t});const A=s.alcohol||{};
  if(c.oil===null||c.oil<=0||c.oil>=100)add('bad','أدخل نسبة الزيت في الخليط (% وزن/وزن).');
  if(!A.fileId)add('warn','SDS الكحول غير مرفوعة في «الشركة والكحول».');
  if(num(A.ethanolWW)===null)add('bad','نسبة الإيثانول في الكحول غير مدخلة («الشركة والكحول»).');
  if(!p.sds.fileId&&!(p.sds.components||[]).length)add('bad','SDS الزيت غير مرفوعة — التصنيف لا يمكن حسابه.');
  else if(!(p.sds.components||[]).length)add('bad','جدول المكونات الخطرة (القسم 3) من SDS الزيت فارغ.');
  if(!p.ifra.fileId&&!Object.keys(p.ifra.cats||{}).length)add('bad','شهادة IFRA للزيت غير مرفوعة.');
  else if(!c.cat4||c.cat4.lim===null)add('warn','حد الفئة 4 من شهادة IFRA غير مقروء.');
  else if(c.cat4.mix<100)add('warn',`الزيت ${fmt(c.oil,1)} % أعلى من حد IFRA للفئة 4 (${fmt(c.cat4.lim,2)} %): الزبون يستطيع استعمال الخليط حتى ${fmt(c.cat4.mix,1)} % فقط في العطر النهائي.`);
  else add('ok',`الخليط يصلح كعطر جاهز (فئة 4) بنسبة 100 % — الزيت ${fmt(c.oil,1)} % ≤ حد IFRA ${fmt(c.cat4.lim,2)} %.`);
  const am=num(p.ifra.amendment);if(am!==null&&am<51)add('warn',`شهادة IFRA حسب التعديل ${am}. اطلب شهادة حسب التعديل 51 أو أحدث.`);
  if(!(p.allergen.items||[]).length)add('bad','إعلان مسببات الحساسية غير مرفوع.');else if(!p.allergen.reg2023)add('warn','إعلان الحساسية لا يذكر القائمة الموسعة 2023/1545.');
  const ban=[...c.allergens.filter(a=>a.banned&&(a.prod===null||a.prod>0)).map(a=>a.banned),...(p.sds.components||[]).map(x=>BANNED[(x.cas||'').trim()]).filter(Boolean)];
  [...new Set(ban)].forEach(b=>add('bad',`مادة ممنوعة في الملحق II: ${b}.`));
  if(c.unsure.length)add('warn',`التصنيف غير مؤكد: ${c.unsure.join(', ')} يظهر فقط بالحد الأعلى لنطاقات SDS. اطلب من المصنع النسب الدقيقة${c.unsureBy.length?' لـ: '+c.unsureBy.slice(0,6).join(', '):''}. التطبيق يستعمل التصنيف الأشد احتياطاً.`);
  if(c.incons.length)add('warn',`تناقض بين SDS وإعلان الحساسية في شهادة المصنع — استُعمل الحد الأعلى: ${c.incons.slice(0,4).join(' · ')}`);
  if(c.cls.r2low.length)add('warn',`مواد Repr. 2 بين 0,3 و 3 %: ${c.cls.r2low.map(i=>i.name).join(', ')} — تُذكر في القسم 3 من SDS، ولا تغيّر التصنيف.`);
  if(!p.ufi)add('warn','رقم UFI غير مدخل — مطلوب على الملصق بعد التسجيل في بوابة ECHA (انظر الدليل).');
  if(!num(p.density))add('warn',`الكثافة مقدّرة (${fmt(c.density,3)} g/ml). قِسها بعد أول دفعة.`);
  const un=['ifra','allergen','sds'].filter(k=>(p[k].fileId||((k==='sds'?p.sds.components:k==='allergen'?p.allergen.items:Object.keys(p.ifra.cats||{}))||[]).length)&&!p[k].checked).length;
  if(un)add('warn',`${un} شهادات لم تؤكد مراجعتها مقابل الأصل.`);
  if(!p.sdsApproved)add('warn','SDS الخليط لم يراجعها شخص مختص بعد — تُطبع بعلامة «Entwurf».');
  if(!p.name)add('bad','أدخل اسم المنتج التجاري.');
  return L}

function saveBatch(b,patch){if(!state.db)return;Object.assign(b,patch);clearTimeout(state.bT);state.bT=setTimeout(async()=>{const body=JSON.parse(JSON.stringify(b));delete body.id;try{await state.db.collection('batches').doc(b.id).set(body)}catch(e){toast('تعذر الحفظ')}},500)}

async function importOrders(p){if(!state.mcp){toast('الربط مع Shopify غير متاح في هذا العرض');return}if(!p.code){toast('أدخل رقم الصنف أولاً');return}
  state.ordMsg='يجلب الطلبات من Shopify…';render();
  try{const q=`query($q:String!){orders(first:100,query:$q,sortKey:CREATED_AT,reverse:true){nodes{name createdAt customer{displayName} billingAddress{company} lineItems(first:50){nodes{sku quantity}}}}}`;
    const r=await state.mcp.callTool('Shopify','graphql_query',{query:q,variables:{q:`sku:${p.code}`}},{cache:false});
    const nodes=((r.payload&&r.payload.data&&r.payload.data.orders&&r.payload.data.orders.nodes)||[]);
    const done=new Set(state.batches.flatMap(b=>(b.deliveries||[]).map(d=>d.order)));
    const open=state.batches.filter(b=>b.productId===p.id&&b.status==='released').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    let added=0,short=0;const changed=new Set();
    for(const o of nodes){if(done.has(o.name))continue;const qty=(o.lineItems.nodes||[]).filter(l=>String(l.sku||'').toLowerCase()===String(p.code).toLowerCase()).reduce((a,l)=>a+(l.quantity||0),0);if(!qty)continue;
      let need=qty;const cust=(o.billingAddress&&o.billingAddress.company)||(o.customer&&o.customer.displayName)||'—';
      for(const b of open){if(!need)break;const free=bRemain(b);if(free<=0)continue;const take=Math.min(free,need);b.deliveries=[...(b.deliveries||[]),{date:Date.parse(o.createdAt)||Date.now(),customer:cust,order:o.name,qty:take}];need-=take;changed.add(b)}
      if(need)short+=need;added++}
    for(const b of changed){const body=JSON.parse(JSON.stringify(b));delete body.id;await state.db.collection('batches').doc(b.id).set(body)}
    state.ordMsg=`${nodes.length} طلب وُجد · ${added} طلب جديد وُزّع على الدفعات${short?` · ⚠ ${short} عبوة بدون دفعة مُفرَجة — أنشئ دفعة جديدة`:''}.`}
  catch(e){state.ordMsg=mcpMsg(e,'Shopify')}render()}

function docCodeOf(p){return p.docCode||('FHL'+(p.factoryCode||String(p.id||'').replace(/[^A-Za-z0-9]/g,'').slice(-7).toUpperCase()))}
function shopTexts(p,c){const nm=(p.name||'').split(' – ')[0];const mix=c.cat4&&c.cat4.mix!==null?c.cat4.mix:null;const H=c.cls.H.join(', ');
  const de=`<p><strong>${esc(nm)}</strong> – gebrauchsfertiges Parfümkonzentrat (Duftöl in Ethanol, ${fmt(c.oil,0)} % Duftöl) zur gewerblichen Weiterverarbeitung und Abfüllung.</p><ul><li>Inhalt: ${esc(p.volumeL||1)} L</li><li>Nur für gewerbliche Verwender</li>${mix!==null?`<li>IFRA-konform – Kategorie 4 bis ${fmt(mix,0)} %</li>`:''}<li>Sicherheitsdatenblatt, IFRA-Erklärung und Allergenerklärung (DE/EN) werden mit jeder Bestellung bereitgestellt</li><li>Jede Charge mit Analysenzertifikat</li><li>Gefahrgut: UN 1266, Klasse 3 – Versand als begrenzte Menge (LQ)</li>${H?`<li>Einstufung (CLP): ${esc(H)}</li>`:''}</ul>`;
  const en=`<p><strong>${esc(nm)}</strong> – ready-to-use perfume concentrate (fragrance oil in ethanol, ${fmt(c.oil,0)} % fragrance oil) for professional further processing and filling.</p><ul><li>Content: ${esc(p.volumeL||1)} L</li><li>For professional users only</li>${mix!==null?`<li>IFRA compliant – category 4 up to ${fmt(mix,0)} %</li>`:''}<li>Safety data sheet, IFRA declaration and allergen declaration (DE/EN) are provided with every order</li><li>Certificate of analysis for every batch</li><li>Dangerous goods: UN 1266, class 3 – shipped as limited quantity (LQ)</li>${H?`<li>Classification (CLP): ${esc(H)}</li>`:''}</ul>`;
  const ar=`<p dir="rtl"><strong>${esc(nm)}</strong> – مركّز عطر جاهز (زيت عطري في الإيثانول، ${fmt(c.oil,0)} % زيت) للمعالجة والتعبئة التجارية.</p><ul dir="rtl"><li>المحتوى: ${esc(p.volumeL||1)} لتر</li><li>للاستخدام التجاري فقط</li>${mix!==null?`<li>مطابق لمعايير IFRA – الفئة 4 حتى ${fmt(mix,0)} %</li>`:''}<li>ورقة بيانات السلامة وإعلان IFRA وإعلان مسببات الحساسية (ألماني/إنجليزي) مع كل طلب</li><li>شهادة تحليل لكل دفعة</li><li>بضاعة خطرة: UN 1266، الفئة 3 – تُشحن ككمية محدودة (LQ)</li></ul>`;
  return{title:{de:`${nm} – Parfümkonzentrat ${p.volumeL||1} L`,en:`${nm} – Perfume Concentrate ${p.volumeL||1} L`,ar:`${nm} – مركّز عطر ${p.volumeL||1} لتر`},body:{de,en,ar}}}
function pubIssues(p,c){const L=checks(p,state.settings,c).filter(x=>x.lvl==='bad').map(x=>x.t);if(!p.sdsApproved)L.push('SDS لم يراجعها شخص مختص بعد — أشّر المراجعة أولاً.');if(!p.ufi||/muster/i.test(p.ufi))L.push('أدخل رقم UFI الحقيقي (ليس التجريبي).');if(!p.code)L.push('أدخل رقم الصنف.');return L}
async function publishDocs(p){const s=state.settings;if(!state.mcp){toast('الربط مع Google غير متاح');return}const key=p.id+'pub';
  const old=p.docs||{};const code=docCodeOf(p);
  try{if(old.enId||old.deId){const v=String(p.sdsVersion||'1.0').split('.');p.sdsVersion=`${v[0]}.${(+v[1]||0)+1}`}p.sdsDate=Date.now();p.docCode=code;save(p);
    const out={};
    for(const lang of ['en','de']){state.busy[key]=`ينشئ ملف ${lang==='en'?'الإنجليزي':'الألماني'} ويرفعه إلى Drive…`;render();
      const doc=await packDoc(p,lang);const blob=doc.output('blob');const title=lang==='en'?`${code}.pdf`:`${code} de-DE.pdf`;
      const parentId=lang==='en'?s.folderEn:s.folderDe;let arg;const lt=await state.mcp.listTools().catch(()=>({}));
      arg=await blobB64(blob);
      const cr=await state.mcp.callTool('Google Drive','create_file',{title,parentId,base64Content:arg,contentMimeType:'application/pdf',disableConversionToGoogleType:true},{cache:false});
      const f=cr.payload||{};const id=f.id||(f.file&&f.file.id);if(!id)throw{code:'tool_error',message:'لم يُنشأ الملف'};
      let url=f.viewUrl||'';try{const sh=await state.mcp.callTool('Google Drive','share_file',{fileId:id,role:'reader',permissionId:'anyoneWithLink'},{cache:false});url=(sh.payload&&(sh.payload.shareableLink||sh.payload.viewUrl))||url}catch(e){}
      out[lang]={id,url};
      const prev=old[lang+'Id'];if(prev&&prev!==id){try{await state.mcp.callTool('Google Drive','update_file',{fileId:prev,title:`Archiv ${p.name} – ersetzt ${deDate()}.pdf`},{cache:false})}catch(e){}}}
    p.docs={enId:out.en.id,enUrl:out.en.url,deId:out.de.id,deUrl:out.de.url,at:Date.now(),version:p.sdsVersion};save(p);
    state.busy[key]='يسجّل الصنف في جدول الأكواد…';render();
    try{const r=await state.mcp.callTool('Google Sheets','get_values',{spreadsheetId:CODES_SHEET,range:'D2:D3000'},{cache:false});const has=((r.payload&&r.payload.values)||[]).some(v=>String(v[0]||'').trim()===p.code);
      if(!has)await state.mcp.callTool('Google Sheets','append_values',{spreadsheetId:CODES_SHEET,range:'C1',values:[[(p.name||'').split(' – ')[0]+` (${p.volumeL||1} L)`,p.code,code]]},{cache:false});state.codes=null}catch(e){toast('لم يُسجَّل في جدول الأكواد: '+mcpMsg(e,'Google Sheets'))}
    toast('رُفعت المستندات إلى Drive (DE + EN)')}
  catch(e){toast('تعذر الرفع: '+mcpMsg(e,'Google Drive'))}finally{delete state.busy[key];render()}}
async function publishShop(p,c){if(!state.mcp){toast('الربط مع Shopify غير متاح');return}const key=p.id+'pub';const s=state.settings;const tx=shopTexts(p,c);
  const price=num(p.price);if(!price){toast('أدخل سعر البيع الصافي');return}
  const handle=(p.shopify&&p.shopify.handle)||String(p.code).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  try{state.busy[key]='ينشئ المنتج في Shopify (مسودة)…';render();
    const mf=[{namespace:'custom',key:'ufi',type:'single_line_text_field',value:p.ufi||''},{namespace:'custom',key:'un_nummer',type:'single_line_text_field',value:'UN 1266, Kl. 3, VG II (LQ)'},{namespace:'custom',key:'clp_einstufung',type:'single_line_text_field',value:c.cls.H.join(', ')||'—'}];
    if(p.docs&&p.docs.deUrl)mf.push({namespace:'custom',key:'sdb_de',type:'url',value:p.docs.deUrl});if(p.docs&&p.docs.enUrl)mf.push({namespace:'custom',key:'sds_en',type:'url',value:p.docs.enUrl});
    const input={title:tx.title.de,descriptionHtml:tx.body.de,handle,vendor:s.company,productType:'Parfümkonzentrat',status:'DRAFT',tags:['Literware','B2B','Gewerblich','Parfümkonzentrat','UN1266','Gefahrgut'],
      productOptions:[{name:'Größe',values:[{name:`${p.volumeL||1} L`}]}],metafields:mf,
      variants:[{optionValues:[{optionName:'Größe',name:`${p.volumeL||1} L`}],sku:p.code,price:String(price.toFixed(2)),taxable:true,inventoryPolicy:'DENY',
        inventoryItem:{sku:p.code,requiresShipping:true,tracked:true,countryCodeOfOrigin:'DE',harmonizedSystemCode:'330300',measurement:{weight:{unit:'KILOGRAMS',value:Math.round((c.massKg||1)*1000+150)/1000}}}}]};
    const m=`mutation($input:ProductSetInput!,$id:ProductSetIdentifiers){productSet(input:$input,identifier:$id,synchronous:true){product{id handle title}userErrors{field message}}}`;
    const r=await state.mcp.callTool('Shopify','graphql_mutation',{query:m,variables:{input,id:{handle}}},{cache:false});
    const ps=r.payload&&r.payload.data&&r.payload.data.productSet;const ue=ps&&ps.userErrors||[];if(ue.length)throw{code:'tool_error',message:ue.map(x=>x.message).join('; ')};
    const prod=ps&&ps.product;if(!prod)throw{code:'tool_error',message:'لم يُنشأ المنتج'};
    state.busy[key]='يضيف الترجمة الإنجليزية والعربية…';render();
    try{const tq=`query($id:ID!){translatableResource(resourceId:$id){translatableContent{key digest locale}}}`;const tr=await state.mcp.callTool('Shopify','graphql_query',{query:tq,variables:{id:prod.id}},{cache:false});
      const tc=(tr.payload&&tr.payload.data&&tr.payload.data.translatableResource&&tr.payload.data.translatableResource.translatableContent)||[];const dg=k=>(tc.find(x=>x.key===k)||{}).digest;
      const tl=[];for(const lc of ['en','ar']){if(dg('title'))tl.push({key:'title',locale:lc,value:tx.title[lc],translatableContentDigest:dg('title')});if(dg('body_html'))tl.push({key:'body_html',locale:lc,value:tx.body[lc],translatableContentDigest:dg('body_html')})}
      if(tl.length)await state.mcp.callTool('Shopify','graphql_mutation',{query:`mutation($id:ID!,$t:[TranslationInput!]!){translationsRegister(resourceId:$id,translations:$t){userErrors{message}}}`,variables:{id:prod.id,t:tl}},{cache:false})}catch(e){toast('المنتج أُنشئ، لكن الترجمة لم تُحفظ: '+mcpMsg(e,'Shopify'))}
    p.shopify={id:prod.id,handle:prod.handle,at:Date.now()};save(p);toast('أُنشئ المنتج في Shopify كمسودة')}
  catch(e){toast('تعذر: '+mcpMsg(e,'Shopify'))}finally{delete state.busy[key];render()}}

  pane.querySelectorAll('[data-checked]').forEach(cb=>cb.onchange=()=>{p[cb.dataset.checked].checked=cb.checked;save(p);renderList()});
  pane.querySelectorAll('[data-ifra]').forEach(el=>el.addEventListener('input',()=>{p.ifra.cats={...(p.ifra.cats||{}),[el.dataset.ifra]:el.value};save(p);renderList()}));
  pane.querySelectorAll('[data-al]').forEach(el=>el.addEventListener('input',()=>{p.allergen.items[+el.dataset.al][el.dataset.f]=el.value;save(p)}));

  const aa=$('#alAdd');if(aa)aa.onclick=()=>{p.allergen.items.push({name:'',cas:'',pct:''});save(p);renderSheet()};
  pane.querySelectorAll('[data-cp]').forEach(el=>el.addEventListener('input',()=>{p.sds.components[+el.dataset.cp][el.dataset.f]=el.value;save(p);renderList()}));
  pane.querySelectorAll('[data-cprm]').forEach(b=>b.onclick=()=>{p.sds.components.splice(+b.dataset.cprm,1);save(p);renderSheet()});
  const ca=$('#cpAdd');if(ca)ca.onclick=()=>{p.sds.components.push({name:'',cas:'',pct:'',hazard:'',m:''});save(p);renderSheet()};
  pane.querySelectorAll('input[data-file]').forEach(inp=>inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)handleFile(p,inp.dataset.file,f);inp.value=''});

  pane.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{const [k,lang]=b.dataset.pd.split('-');(k==='pack'?packDoc(p,lang).then(doc=>saveBlob(doc.output('blob'),fnSafe(`${p.name} – ${lang==='de'?'Dokumente':'Documents'}.pdf`))):pdfDoc(p,k,lang)).catch(e=>toast('تعذر إنشاء الملف: '+(e.message||e)))});
  const pd=$('#pubDocs');if(pd)pd.onclick=()=>publishDocs(p);const psh=$('#pubShop');if(psh)psh.onclick=()=>publishShop(p,c);
  const so=$('#shopOrders');if(so)so.onclick=()=>importOrders(p);
  pane.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>go('batchd',{id:p.id,bid:b.dataset.batch}));
  const nv=$('#nbVol');if(nv)nv.addEventListener('input',()=>{state.newVol=nv.value;clearTimeout(state.nvT);state.nvT=setTimeout(()=>{renderSheet();const x=$('#nbVol');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},500)});
  const nb=$('#nbAdd');if(nb)nb.onclick=()=>addBatch(p,c);
  const dg=$('#driveGo');if(dg)dg.onclick=()=>fetchCerts(p);
  const cr=$('#calcRep');if(cr)cr.onclick=()=>pdfCalcReport(p).catch(e=>toast('تعذر إنشاء الملف: '+(e.message||e)));
  pane.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.copy);navigator.clipboard.writeText(el.textContent).then(()=>toast('تم النسخ')).catch(()=>{const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('النص محدد — انسخه يدوياً')})});
}

async function pdfText(file){if(!window.pdfjsLib)throw new Error('pdf.js nicht geladen');const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];
  for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();let out='',last=null,line='';for(const it of tc.items){const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>2){out+=line+'\n';line=''}line+=(line?' ':'')+it.str;last=y}pages.push(out+line)}return{pages,pdf}}
async function pdfImages(pdf,nums,maxBytes){const out=[];for(const i of nums){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;let q=.9,b;do{b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));q-=.15}while(maxBytes&&b.size>maxBytes&&q>.3);out.push(b)}return out}
const PAGE_RE={ifra:/IFRA/i,allergen:/allergen|2023\/1545|ANNEX\s*III|ANHANG\s*III/i,sds:/Sicherheitsdatenblatt|Safety\s+Data\s+Sheet|ABSCHNITT\s+3|SECTION\s+3|Zusammensetzung|Composition/i};
function pickPages(pages,k){if(!PAGE_RE[k])return pages.map((_,i)=>i+1);const hit=[];pages.forEach((t,i)=>{if(PAGE_RE[k].test(t))hit.push(i+1)});const ext=new Set(hit);hit.forEach(n=>{if(n<pages.length)ext.add(n+1)});const r=[...ext].sort((a,b)=>a-b);return r.length?r:pages.map((_,i)=>i+1)}
const PROMPTS={
 ifra:`You read an IFRA Certificate of Conformity for a fragrance oil. Copy values exactly as printed; never guess; null when absent.
Reply with only JSON: {"amendment":number|null,"date":string|null,"batch_number":string|null,"categories":{"1":v,"2":v,"3":v,"4":v,"5A":v,"5B":v,"5C":v,"5D":v,"6":v,"7A":v,"7B":v,"8":v,"9":v,"10A":v,"10B":v,"11A":v,"11B":v,"12":v}}
Each v is the maximum % of this fragrance in the finished product for that IFRA category as a number, the string "no restriction" if the certificate says so, or null if not stated. A comma is a decimal separator.`,
 allergen:`You read a fragrance allergen declaration for a fragrance oil. Copy values exactly as printed; never guess.
Reply with only JSON: {"date":string|null,"mentions_2023_1545":boolean,"items":[{"name":string,"cas":string|null,"percent":number|null}]}
Include EVERY row, also not-detected rows (percent 0). percent = % w/w in the oil; ppm/mg/kg -> divide by 10000. A comma is a decimal separator.`,
 sds:`You read a Safety Data Sheet (SDS) of a fragrance oil. Copy values exactly as printed; never guess; null when absent.
Reply with only JSON: {"ufi":string|null,"batch_number":string|null,"revision_date":string|null,"flash_point_c":number|null,"density_g_ml":number|null,"appearance":string|null,"wgk":string|null,"hazard_statements":[string],"components":[{"name":string,"cas":string|null,"percent":string|null,"hazard":string|null,"m_factor":number|null}]}
hazard_statements: H-codes with text. components: ALL rows of the section 3 composition table, percent range exactly as printed (e.g. ">= 1 - < 3"), CLP classification as printed (e.g. "Skin Sens. 1B, H317; Aquatic Chronic 2, H411"), M-factor if given. wgk: water hazard class (Wassergefährdungsklasse) from section 15 if given.`,
 alcohol:`You read a specification or SDS of a (denatured) ethanol used for perfume. Copy values exactly as printed; never guess; null when absent.
Reply with only JSON: {"product_name":string|null,"ethanol_percent_ww":number|null,"ethanol_percent_vv":number|null,"flash_point_c":number|null,"hazard_statements":[string],"wgk":string|null,"denaturants":[{"name":string,"cas":string|null,"percent_ww_in_alcohol":number|null,"hazard":string|null}]}
Only fill ethanol_percent_ww if % w/w or % m/m is stated.`};
async function isPdf(file){if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||''))return true;try{const h=new Uint8Array(await file.slice(0,5).arrayBuffer());return String.fromCharCode(...h)==='%PDF-'}catch(e){return false}}
async function storeFile(file){if(state.assets){try{const up=await state.assets.upload(file);return{fileId:up.id,fileUrl:up.url}}catch(e){toast('تعذر حفظ الملف: '+(e.message||e.code))}}return{fileId:'local-'+Date.now(),fileUrl:''}}
async function extract(k,file,parsed){
  const lim=await state.sample.limits().catch(()=>null);const canImg=!!(lim&&lim.images);let text='',images=null;
  if(parsed){const nums=pickPages(parsed.pages,k);text=nums.map(n=>`--- Seite ${n} ---\n`+parsed.pages[n-1]).join('\n\n');
    const thin=text.replace(/\s|---\s*Seite\s*\d+\s*---/g,'').length<150;
    if(canImg&&(thin||k!=='alcohol')){images=await pdfImages(parsed.pdf,nums.slice(0,Math.min(lim.images.maxCount||4,k==='sds'?4:6)),lim.images.maxInputBytes)}
    else if(thin)throw new Error('الملف ممسوح ولا يمكن قراءته');}
  else{if(!canImg)throw new Error('قراءة الصور غير متاحة');images=[file]}
  const prompt=PROMPTS[k]+'\nThe file may combine several documents; use only the part matching this document type.'+(images&&text?'\nYou get page images and an OCR text layer; trust the images for numbers.':'')+(text?'\n\nDocument text:\n'+text.slice(0,180000):'\n\nThe document is in the attached images.');
  return state.sample.json(prompt,{modelTier:'complex',cache:false,...(images?{images}:{})})}
async function handleFile(p,k,file){const key=p.id+k;if(file.size>20*1024*1024){toast('الملف أكبر من 20 MB');return}
  const pdf=await isPdf(file);if(k==='combined'&&!pdf){toast('الملف الشامل يجب أن يكون PDF');return}
  state.busy[key]='جارٍ الحفظ…';renderSheet();
  try{const st=await storeFile(file);const kinds=k==='combined'?['ifra','allergen','sds']:[k];
    kinds.forEach(x=>{Object.assign(p[x],{fileId:st.fileId,fileUrl:st.fileUrl,fileName:file.name,checked:false})});save(p);
    if(!state.sample){toast('القراءة الآلية غير متاحة — أدخل القيم يدوياً');return}
    let parsed=null;if(pdf){state.busy[key]='جارٍ فتح PDF…';renderSheet();parsed=await pdfText(file)}
    for(const x of kinds){state.busy[key]='يقرأ النظام '+({ifra:'شهادة IFRA',allergen:'جدول الحساسية',sds:'SDS'})[x]+'…';renderSheet();
      try{apply(p,x,await extract(x,file,parsed));save(p)}catch(e){if(e&&e.code==='not_granted')throw e;toast('تعذرت قراءة جزء: '+(e.message||e.code||e))}}
    toast('تمت القراءة — راجع القيم مقابل الأصل')}
  catch(e){toast(e&&e.code==='not_granted'?'لم تُمنح صلاحية القراءة الآلية':'تعذرت القراءة: '+(e.message||e.code||e))}
  finally{delete state.busy[key];renderAll()}}
function apply(p,k,r){if(!r||typeof r!=='object')return;
  if(k==='ifra'){p.ifra.amendment=r.amendment??'';p.ifra.date=r.date??'';const cats={};Object.entries(r.categories||{}).forEach(([a,v])=>{if(v!==null&&v!==undefined)cats[a]=String(v)});p.ifra.cats=cats}
  if(k==='allergen'){p.allergen.date=r.date??'';p.allergen.reg2023=!!r.mentions_2023_1545;p.allergen.items=(r.items||[]).map(a=>({name:String(a.name||''),cas:a.cas?String(a.cas):'',pct:a.percent==null?'':String(a.percent)}))}
  if(k==='sds'){p.sds.date=r.revision_date??'';p.sds.flash=r.flash_point_c??'';p.sds.density=r.density_g_ml??'';p.sds.appearance=r.appearance??'';p.sds.wgk=r.wgk??'';p.sds.hazards=(r.hazard_statements||[]).join('\n');
    p.sds.components=(r.components||[]).map(x=>({name:String(x.name||''),cas:x.cas?String(x.cas):'',pct:x.percent?String(x.percent):'',hazard:x.hazard?String(x.hazard):'',m:x.m_factor??''}));if(!p.appearance&&r.appearance)p.appearance=r.appearance;if(!p.oilUfi&&r.ufi)p.oilUfi=String(r.ufi)}
  if((k==='ifra'||k==='sds')&&r.batch_number&&!p.oilBatch)p.oilBatch=String(r.batch_number)}
async function handleAlcohol(file){const s=state.settings;state.busy.alcohol='جارٍ الحفظ…';renderSettings();
  try{const pdf=await isPdf(file);const st=await storeFile(file);Object.assign(s.alcohol,{fileId:st.fileId,fileUrl:st.fileUrl,fileName:file.name,checked:false});saveSettings();
    if(!state.sample){toast('أدخل القيم يدوياً');return}state.busy.alcohol='يقرأ النظام SDS الكحول…';renderSettings();
    const r=await extract('alcohol',file,pdf?await pdfText(file):null);
    if(r){if(r.product_name)s.alcohol.name=r.product_name;if(r.ethanol_percent_ww!=null)s.alcohol.ethanolWW=r.ethanol_percent_ww;if(r.flash_point_c!=null)s.alcohol.flash=r.flash_point_c;if((r.hazard_statements||[]).length)s.alcohol.hazards=hcodes(r.hazard_statements.join(' ')).join(', ');if(r.wgk)s.alcohol.wgk=r.wgk;
      if((r.denaturants||[]).length)s.alcohol.denats=r.denaturants.map(d=>({name:d.name||'',inci:'',cas:d.cas||'',pct:d.percent_ww_in_alcohol??'',hazard:d.hazard||''}))}
    saveSettings();toast('تمت القراءة — راجع القيم')}
  catch(e){toast('تعذرت القراءة: '+(e.message||e.code||e))}finally{delete state.busy.alcohol;renderSettings();renderAll()}}
